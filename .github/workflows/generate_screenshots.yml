name: Generate Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'shaders/**'
      - 'example/lib/**'
      - 'example/integration_test/**'

permissions:
  contents: write

jobs:
  capture-screenshots:
    name: Run Flutter Drive Screenshots
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Run Flutter Drive on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: |
            cd example
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshot_test.dart

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: particle-orb-screenshots
          path: example/doc/screenshots/
          retention-days: 14

      - name: Auto-commit Updated Screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(screenshots): auto-update showcase screenshots [skip ci]"
          file_pattern: "example/doc/screenshots/*.png"
