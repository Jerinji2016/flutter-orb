name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Gatekeeper: Static Analysis & Linting (Fast Feedback)
  # ============================================================================
  analyze-and-lint:
    name: 1. Flutter Analyze & Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Package
        run: flutter analyze --fatal-infos

      - name: Analyze Example App
        run: |
          cd example
          flutter analyze --fatal-infos

  # ============================================================================
  # 2. Automated Test Suite: Unit, Widget & Integration Tests
  # ============================================================================
  test-suite:
    name: 2. Automated Test Suite (Unit, Widget & Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze-and-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      # --- Fast Fail-First: Unit & Widget Tests ---
      - name: Run Package Unit Tests
        run: flutter test --coverage

      - name: Run Example Widget Tests
        run: |
          cd example
          flutter test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          slug: Jerinji2016/flutter-orb

      # --- Hardware Acceleration & Integration Tests ---
      - name: Enable KVM Hardware Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: Run Flutter Drive Integration Tests (Android Emulator with KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: cd example && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_test.dart

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: example/doc/screenshots/
          retention-days: 14
