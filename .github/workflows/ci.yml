name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============================================================================
  # 1. Gatekeeper: Static Analysis & Linting (Fast Feedback)
  # ============================================================================
  analyze-and-lint:
    name: 1. Flutter Analyze & Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_code_changes: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Relevant Code Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'lib/**'
              - 'shaders/**'
              - 'test/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
              - 'web/**'

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Package
        run: flutter analyze --fatal-infos

      - name: Analyze Example App
        run: |
          cd example
          flutter analyze --fatal-infos

  # ============================================================================
  # 2. Automated Test Suite: Unit, Widget & Integration Tests
  #    Only runs if relevant code files were modified or triggered manually
  # ============================================================================
  test-suite:
    name: 2. Automated Test Suite (Unit, Widget & Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze-and-lint]
    if: needs.analyze-and-lint.outputs.has_code_changes == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      # --- Fast Fail-First: Unit & Widget Tests ---
      - name: Run Package Unit Tests
        run: flutter test --coverage

      - name: Run Example Widget Tests
        run: |
          cd example
          flutter test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          slug: Jerinji2016/flutter-orb

      # --- Hardware Acceleration & Integration Tests ---
      - name: Enable KVM Hardware Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: Run Flutter Drive Integration Tests (Android Emulator with KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: cd example && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshot_test.dart

      - name: Post Showcase Screenshots to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repo = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const rawBase = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${sha}/example/doc/screenshots`;

            const commentHeader = '### 📸 Visual Showcase (Integration Test Screenshots)';
            const commentBody = [
              commentHeader,
              '',
              '| Google Gemini Aura | Cyberpunk Electric Pulse | Solar Flare Dynamics |',
              '| :---: | :---: | :---: |',
              `| <img src="${rawBase}/01_gemini_neon.png" width="220" alt="Gemini Neon" /> | <img src="${rawBase}/02_cyberpunk_pulse.png" width="220" alt="Cyberpunk Pulse" /> | <img src="${rawBase}/03_solar_flare.png" width="220" alt="Solar Flare" /> |`,
              '',
              '| Emerald Deep Mint | Neon Rose Hot Pink | Monochrome Minimalist |',
              '| :---: | :---: | :---: |',
              `| <img src="${rawBase}/04_emerald_deep.png" width="220" alt="Emerald Deep" /> | <img src="${rawBase}/05_neon_rose.png" width="220" alt="Neon Rose" /> | <img src="${rawBase}/06_monochrome.png" width="220" alt="Monochrome" /> |`,
              '',
              '| Compact Bubble Assistant | Live Shader & Audio Tuning Sheet |',
              '| :---: | :---: |',
              `| <img src="${rawBase}/07_compact_bubble.png" width="300" alt="Compact Bubble" /> | <img src="${rawBase}/08_tuning_sheet.png" width="300" alt="Tuning Sheet" /> |`,
              '',
              `> *Generated automatically from Android Emulator Drive Integration Test on commit \`${sha.substring(0, 7)}\`.*`
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                ...repo,
                issue_number,
              });

              const existingComment = comments.find(c =>
                c.body && c.body.includes(commentHeader)
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  ...repo,
                  comment_id: existingComment.id,
                  body: commentBody,
                });
                console.log(`Updated existing PR comment: ${existingComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number,
                  body: commentBody,
                });
                console.log('Posted new PR comment with screenshots.');
              }
            } catch (error) {
              console.error('Failed to post screenshots comment to PR:', error);
            }
