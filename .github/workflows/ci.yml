name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Static Analysis & Linting
  # ============================================================================
  analyze-and-lint:
    name: 1. Flutter Analyze & Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Package & Example Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Package
        run: flutter analyze --fatal-infos

      - name: Analyze Example App
        run: |
          cd example
          flutter analyze --fatal-infos

  # ============================================================================
  # 2. Unit & Widget Testing
  # ============================================================================
  unit-tests:
    name: 2. Unit & Widget Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze-and-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Run Package Unit Tests
        run: flutter test --coverage

      - name: Run Example Widget Tests
        run: |
          cd example
          flutter test

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # 3. Integrated Testing & Screenshot Verification
  # ============================================================================
  integration-tests:
    name: 3. Integrated Testing & Screenshots
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [analyze-and-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Run Flutter Drive Integration Tests (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            cd example
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshot_test.dart

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: example/doc/screenshots/
          retention-days: 14
