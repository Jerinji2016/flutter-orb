name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for pub.dev automated OIDC publishing

jobs:
  # ============================================================================
  # 1. Static Analysis & Linting
  # ============================================================================
  analyze-and-lint:
    name: 1. Flutter Analyze & Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Package & Example Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Package
        run: flutter analyze --fatal-infos

      - name: Analyze Example App
        run: |
          cd example
          flutter analyze --fatal-infos

  # ============================================================================
  # 2. Unit & Widget Testing
  # ============================================================================
  unit-tests:
    name: 2. Unit & Widget Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze-and-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Run Package Unit Tests
        run: flutter test --coverage

      - name: Run Example Widget Tests
        run: |
          cd example
          flutter test

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # 3. Integrated Testing & Screenshot Verification
  # ============================================================================
  integration-tests:
    name: 3. Integrated Testing & Screenshots
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [analyze-and-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Run Flutter Drive Integration Tests (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            cd example
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshot_test.dart

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: example/doc/screenshots/
          retention-days: 14

  # ============================================================================
  # 4. Increment Package Version & Commit
  # ============================================================================
  version-bump:
    name: 4. Increment Version & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_type: ${{ steps.bump.outputs.bump_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Bump & Update Files
        id: bump
        run: |
          # 1. Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d ' "')
          echo "Current Version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # 2. Inspect latest commit message
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit Message: $COMMIT_MSG"

          # 3. Calculate new version:
          #    feat -> major
          #    fix, chore, docs, refactor, style, test, perf -> minor
          if echo "$COMMIT_MSG" | grep -qiE "(^feat|feat\(|BREAKING)"; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_VERSION="${NEW_MAJOR}.0.0"
            BUMP_TYPE="major (feat)"
          else
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
            BUMP_TYPE="minor (fix/chore/docs)"
          fi

          echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          # 4. Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # 5. Prepend release notes to CHANGELOG.md
          TODAY=$(date +'%Y-%m-%d')
          CHANGELOG_ENTRY="## $NEW_VERSION ($TODAY)\n\n- $COMMIT_MSG\n"
          echo -e "$CHANGELOG_ENTRY\n$(cat CHANGELOG.md)" > CHANGELOG.md

          # 6. Configure Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 7. Commit, Tag, and Push
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin main --tags

  # ============================================================================
  # 5. Publish to pub.dev
  # ============================================================================
  publish-pub-dev:
    name: 5. Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-bump]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository at Bumped Version
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install Package Dependencies
        run: dart pub get

      - name: Publish Dry-Run Check
        run: dart pub publish --dry-run

      - name: Publish Package to pub.dev
        run: dart pub publish --force
