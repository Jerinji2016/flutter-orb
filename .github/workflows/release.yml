name: Release Pipeline

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for automated pub.dev OIDC publishing

jobs:
  release:
    name: Bump Version, Publish to pub.dev & Tag Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[skip release]') && !contains(github.event.pull_request.title, '[skip ci]'))

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      # ========================================================================
      # 1. Bump version: 0.x.0 for feat | 0.0.x for doc, fix, chore, etc.
      # ========================================================================
      - name: Determine Version Bump & Update Files
        id: bump
        run: |
          # Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d ' "')
          echo "Current Version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Get PR title or fallback commit message
          TITLE="${{ github.event.pull_request.title }}"
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --pretty=%B | head -n 1)
          fi
          echo "Evaluating Title: $TITLE"

          # Version Bump Rules:
          # - feat -> major bump in 0.x.0 (increments MINOR and resets PATCH to 0)
          # - doc, fix, chore, etc. -> minor bump in 0.0.x (increments PATCH)
          if echo "$TITLE" | grep -qiE "(^feat|feat\(|BREAKING)"; then
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
            BUMP_TYPE="major/feat (0.x.0)"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            BUMP_TYPE="minor/fix/chore/doc (0.0.x)"
          fi

          echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_title=$TITLE" >> "$GITHUB_OUTPUT"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # Prepend release entry to CHANGELOG.md
          TODAY=$(date +'%Y-%m-%d')
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            ENTRY_HEADER="## $NEW_VERSION ($TODAY)\n\n- $TITLE (#$PR_NUMBER)\n"
          else
            ENTRY_HEADER="## $NEW_VERSION ($TODAY)\n\n- $TITLE\n"
          fi
          echo -e "$ENTRY_HEADER\n$(cat CHANGELOG.md)" > CHANGELOG.md

      # ========================================================================
      # 2. Publish the build to pub.dev (Validates before tagging/committing)
      # ========================================================================
      - name: Install Package Dependencies
        run: flutter pub get

      - name: Publish Dry-Run Check
        run: dart pub publish --dry-run

      - name: Publish Package to pub.dev
        run: dart pub publish --force

      # ========================================================================
      # 3. Create release tag, commit version changes & push (Only after publish)
      # ========================================================================
      - name: Commit Version Changes, Tag Release & Push to main
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin main --tags

          # Create GitHub Release
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --notes "Released **v$NEW_VERSION** to pub.dev: https://pub.dev/packages/flutter_orb/versions/$NEW_VERSION"
