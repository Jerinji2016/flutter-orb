name: Version Bump & Tag

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-tag:
    name: Calculate Version, Update Files & Push Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[skip release]') && !contains(github.event.pull_request.title, '[skip ci]'))

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      # ========================================================================
      # 1. Bump version: 0.x.0 for feat | 0.0.x for doc, fix, chore, etc.
      # ========================================================================
      - name: Determine Version Bump & Update Files
        id: bump
        run: |
          # Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d ' "')
          echo "Current Version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Get PR title or fallback commit message
          TITLE="${{ github.event.pull_request.title }}"
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --pretty=%B | head -n 1)
          fi
          echo "Evaluating Title: $TITLE"

          # Version Bump Rules:
          # - feat -> major bump in 0.x.0 (increments MINOR and resets PATCH to 0)
          # - doc, fix, chore, etc. -> minor bump in 0.0.x (increments PATCH)
          if echo "$TITLE" | grep -qiE "(^feat|feat\(|BREAKING)"; then
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
            BUMP_TYPE="feat (0.x.0)"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            BUMP_TYPE="fix/chore/doc (0.0.x)"
          fi

          echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_title=$TITLE" >> "$GITHUB_OUTPUT"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # Prepend release entry to CHANGELOG.md
          TODAY=$(date +'%Y-%m-%d')
          PR_NUMBER="${{ github.event.pull_request.number }}"
          TEMP_CHANGELOG=$(mktemp)
          if [ -n "$PR_NUMBER" ]; then
            printf "## %s (%s)\n\n- %s (#%s)\n\n" "$NEW_VERSION" "$TODAY" "$TITLE" "$PR_NUMBER" > "$TEMP_CHANGELOG"
          else
            printf "## %s (%s)\n\n- %s\n\n" "$NEW_VERSION" "$TODAY" "$TITLE" > "$TEMP_CHANGELOG"
          fi
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> "$TEMP_CHANGELOG"
          fi
          mv "$TEMP_CHANGELOG" CHANGELOG.md

      # ========================================================================
      # 2. Commit Version Changes, Create Release Tag & Push to main
      # ========================================================================
      - name: Commit Version Changes, Create Tag & Push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git push origin main --tags
